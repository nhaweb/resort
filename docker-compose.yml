services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orilla
      POSTGRES_PASSWORD: orilla
      POSTGRES_DB: orilla
    ports:
      - "5432:5432"
    volumes:
      - orilla_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orilla -d orilla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orilla_pg:
